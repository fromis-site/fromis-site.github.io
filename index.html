<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tweet Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --surface:   #0f0f0f;
      --surface2:  #141414;
      --border:    #1c1c1c;
      --border2:   #282828;
      --text:      #d8d8d8;
      --text-muted:#555;
      --text-dim:  #333;
      --white:     #f0f0f0;
      --accent:    #c8b8a2;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ── HEADER ── */
    #header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px 18px;
      border-bottom: 1px solid var(--border);
    }

    .site-title {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      letter-spacing: 0.04em;
      color: var(--white);
      font-weight: 400;
    }

    .site-title span {
      font-style: italic;
      color: var(--accent);
    }

    .header-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
    }

    /* ── SEARCH ── */
    .search-wrap {
      padding: 12px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-icon {
      color: var(--text-dim);
      font-size: 13px;
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    #search-input::placeholder {
      color: var(--text-dim);
    }

    /* ── YEAR TABS ── */
    .year-tabs {
      display: flex;
      gap: 0;
      padding: 0 40px;
    }

    .year-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 14px 20px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .year-tab:hover { color: var(--text-muted); }

    .year-tab.active {
      color: var(--white);
      border-bottom-color: var(--accent);
    }

    /* ── MONTH BAR ── */
    .month-bar {
      display: flex;
      gap: 0;
      padding: 0 40px;
      border-top: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .month-bar::-webkit-scrollbar { display: none; }

    .month-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      cursor: default;
      transition: all 0.15s;
      position: relative;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .month-btn.has-data {
      color: var(--text-muted);
      cursor: pointer;
    }

    .month-btn.has-data:hover { color: var(--text); }

    .month-btn.active {
      color: var(--white);
      border-bottom-color: var(--white);
    }

    .month-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    /* ── TAG FILTER ── */
    .tag-filter {
      display: flex;
      gap: 8px;
      padding: 16px 40px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }

    .tag-filter-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      margin-right: 4px;
    }

    .tag-pill {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      padding: 4px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tag-pill:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .tag-pill.active {
      background: var(--white);
      border-color: var(--white);
      color: var(--bg);
    }

    /* ── MAIN CONTENT ── */
    #main {
      position: relative;
      z-index: 1;
      padding: 36px 40px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      color: var(--white);
      font-weight: 400;
    }

    .section-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* ── CARD GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    /* ── TWEET CARD ── */
    .tweet-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 22px;
      transition: all 0.2s ease;
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tweet-card:hover {
      background: var(--surface2);
      border-color: var(--border2);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--bg);
      flex-shrink: 0;
    }

    .author-name {
      font-size: 13px;
      color: var(--white);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .author-handle {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    /* ── TAG CHIPS ── */
    .tag-chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tag-chip {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      border: 1px solid;
    }

    /* ── TWEET CONTENT ── */
    .tweet-content {
      font-family: 'DM Serif Display', serif;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 16px;
      font-weight: 400;
    }

    /* ── CARD FOOTER ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .tweet-date {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .view-link {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.15s;
    }

    .view-link:hover { color: var(--accent); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 80px 0;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
    }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 80px 0;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 1; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .header-top  { padding: 16px 20px; }
      .search-wrap { padding: 10px 20px; }
      .year-tabs   { padding: 0 20px; }
      .month-bar   { padding: 0 20px; }
      .tag-filter  { padding: 12px 20px; }
      #main        { padding: 24px 20px 60px; }
      .card-grid   { grid-template-columns: 1fr; }
      .section-title { font-size: 22px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="header-top">
    <div class="site-title">Tweet <span>Archive</span></div>
    <div class="header-meta" id="total-count">— TWEETS</div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search-input" type="text" placeholder="SEARCH TWEETS..." autocomplete="off" />
  </div>

  <!-- Year tabs -->
  <div class="year-tabs" id="year-tabs"></div>

  <!-- Month bar -->
  <div class="month-bar" id="month-bar"></div>

  <!-- Tag filter -->
  <div class="tag-filter" id="tag-filter">
    <span class="tag-filter-label">TAG :</span>
  </div>
</div>

<!-- MAIN -->
<main id="main">
  <div class="loading" id="loading">LOADING...</div>
  <div id="content" style="display:none">
    <div class="section-header">
      <div class="section-title" id="section-title"></div>
      <div class="section-count" id="section-count"></div>
    </div>
    <div class="card-grid" id="card-grid"></div>
  </div>
</main>

<script>
// ── TAG COLOR MAP ─────────────────────────────────────────
const TAG_STYLES = {
  'AI'  : { bg: '#0d1120', color: '#7da9ff', border: '#7da9ff33' },
  '개발': { bg: '#0d1a0d', color: '#5ecb7a', border: '#5ecb7a33' },
  '창업': { bg: '#1a0d0d', color: '#ff7f7f', border: '#ff7f7f33' },
  '인생': { bg: '#1a160a', color: '#f0c060', border: '#f0c06033' },
  '디자인': { bg: '#140d1a', color: '#cc88ff', border: '#cc88ff33' },
  '기타': { bg: '#111', color: '#888', border: '#88888833' },
};

const MONTH_LABELS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

// Avatar color palette (cycles based on handle)
const AVATAR_PALETTE = ['#4361ee','#e63946','#2ec4b6','#f4a261','#8ecae6','#a8dadc','#e9c46a','#ff6b6b'];

function avatarColor(handle) {
  let hash = 0;
  for (let c of handle) hash = (hash * 31 + c.charCodeAt(0)) & 0xffffffff;
  return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function tagStyle(tag) {
  return TAG_STYLES[tag] || TAG_STYLES['기타'];
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
}

// ── STATE ─────────────────────────────────────────────────
let allTweets   = [];
let activeYear  = '';
let activeMonth = '';
let activeTag   = 'ALL';
let searchQuery = '';

// ── FETCH DATA ────────────────────────────────────────────
async function loadTweets() {
  try {
    const res = await fetch('tweets.json');
    allTweets = await res.json();
    // Sort newest first
    allTweets.sort((a, b) => new Date(b.date) - new Date(a.date));
    init();
  } catch (e) {
    document.getElementById('loading').textContent = 'tweets.json 파일을 불러올 수 없습니다.';
  }
}

// ── INIT ──────────────────────────────────────────────────
function init() {
  document.getElementById('total-count').textContent = `${allTweets.length} TWEETS`;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const years = [...new Set(allTweets.map(t => t.date.slice(0, 4)))].sort((a, b) => b - a);
  activeYear  = years[0];

  renderYearTabs(years);
  renderMonthBar();
  renderTagFilter();
  renderCards();
}

// ── YEAR TABS ─────────────────────────────────────────────
function renderYearTabs(years) {
  const el = document.getElementById('year-tabs');
  el.innerHTML = years.map(y => `
    <button class="year-tab ${y === activeYear ? 'active' : ''}" onclick="selectYear('${y}')">${y}</button>
  `).join('');
}

function selectYear(year) {
  activeYear = year;
  activeTag = 'ALL';
  document.querySelectorAll('.year-tab').forEach(b => {
    b.classList.toggle('active', b.textContent === year);
  });
  renderMonthBar();
  renderCards();
}

// ── MONTH BAR ─────────────────────────────────────────────
function renderMonthBar() {
  const monthsWithData = new Set(
    allTweets.filter(t => t.date.startsWith(activeYear)).map(t => parseInt(t.date.slice(5, 7)) - 1)
  );

  // Default to first month with data
  if (!monthsWithData.has(MONTH_LABELS.indexOf(activeMonth))) {
    const months = [...monthsWithData].sort((a, b) => b - a);
    activeMonth = MONTH_LABELS[months[0]] || 'JAN';
  }

  const el = document.getElementById('month-bar');
  el.innerHTML = MONTH_LABELS.map((m, i) => {
    const has = monthsWithData.has(i);
    const isActive = m === activeMonth;
    return `
      <button class="month-btn ${has ? 'has-data' : ''} ${isActive ? 'active' : ''}"
        ${has ? `onclick="selectMonth('${m}')"` : ''}>
        ${m}
        ${has && !isActive ? '<span class="month-dot"></span>' : ''}
      </button>
    `;
  }).join('');
}

function selectMonth(month) {
  activeMonth = month;
  activeTag = 'ALL';
  renderMonthBar();
  renderTagFilter();
  renderCards();
}

// ── TAG FILTER ────────────────────────────────────────────
function renderTagFilter() {
  const monthIndex = MONTH_LABELS.indexOf(activeMonth) + 1;
  const prefix = `${activeYear}-${String(monthIndex).padStart(2, '0')}`;
  const tweets = searchQuery
    ? allTweets.filter(t => matchSearch(t))
    : allTweets.filter(t => t.date.startsWith(prefix));

  const allTags = [...new Set(tweets.flatMap(t => t.tags || []))].sort();
  const el = document.getElementById('tag-filter');

  el.innerHTML = `<span class="tag-filter-label">TAG :</span>
    <button class="tag-pill ${activeTag === 'ALL' ? 'active' : ''}" onclick="selectTag('ALL')">ALL</button>
    ${allTags.map(tag => {
      const s = tagStyle(tag);
      const isActive = activeTag === tag;
      return `<button class="tag-pill ${isActive ? 'active' : ''}"
        style="${isActive ? '' : `color:${s.color};border-color:${s.border};background:${s.bg}`}"
        onclick="selectTag('${tag}')">${tag}</button>`;
    }).join('')}`;
}

function selectTag(tag) {
  activeTag = tag;
  renderTagFilter();
  renderCards();
}

// ── SEARCH ────────────────────────────────────────────────
function matchSearch(t) {
  const q = searchQuery.toLowerCase();
  return (
    t.content.toLowerCase().includes(q) ||
    t.author_name.toLowerCase().includes(q) ||
    t.author_handle.toLowerCase().includes(q) ||
    (t.tags || []).some(tag => tag.toLowerCase().includes(q))
  );
}

document.getElementById('search-input').addEventListener('input', function () {
  searchQuery = this.value.trim();
  activeTag = 'ALL';
  renderTagFilter();
  renderCards();
});

// ── RENDER CARDS ──────────────────────────────────────────
function renderCards() {
  const monthIndex = MONTH_LABELS.indexOf(activeMonth) + 1;
  const prefix = `${activeYear}-${String(monthIndex).padStart(2, '0')}`;

  let tweets = searchQuery
    ? allTweets.filter(t => matchSearch(t))
    : allTweets.filter(t => t.date.startsWith(prefix));

  if (activeTag !== 'ALL') {
    tweets = tweets.filter(t => (t.tags || []).includes(activeTag));
  }

  // Section title
  const titleEl = document.getElementById('section-title');
  const countEl = document.getElementById('section-count');
  if (searchQuery) {
    titleEl.textContent = `"${searchQuery}"`;
    countEl.textContent = `${tweets.length} RESULTS`;
  } else {
    titleEl.textContent = `${activeMonth} ${activeYear}`;
    countEl.textContent = `${tweets.length} TWEETS`;
  }

  const grid = document.getElementById('card-grid');

  if (tweets.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">— NO TWEETS —</div>`;
    return;
  }

  grid.innerHTML = tweets.map((t, i) => {
    const color = avatarColor(t.author_handle);
    const tags = (t.tags || []).map(tag => {
      const s = tagStyle(tag);
      return `<span class="tag-chip" style="background:${s.bg};color:${s.color};border-color:${s.border}">${tag}</span>`;
    }).join('');

    return `
      <div class="tweet-card" style="animation-delay:${i * 0.04}s">
        <div class="card-top">
          <div class="author-row">
            <div class="avatar" style="background:${color}">${initials(t.author_name)}</div>
            <div>
              <div class="author-name">${t.author_name}</div>
              <div class="author-handle">${t.author_handle}</div>
            </div>
          </div>
          <div class="tag-chips">${tags}</div>
        </div>
        <p class="tweet-content">${t.content}</p>
        <div class="card-footer">
          <span class="tweet-date">${formatDate(t.date)}</span>
          ${t.url ? `<a class="view-link" href="${t.url}" target="_blank" rel="noopener">원문 보기 →</a>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// ── START ─────────────────────────────────────────────────
loadTweets();
</script>
</body>
</html>
